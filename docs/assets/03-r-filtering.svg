<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc">
  <title id="title">Ask for the years, species and gears you need</title>
  <desc id="desc">Selection and output schema only; no example research observations are shown. Documentation schematic; no research data.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0072B2" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="565" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.3" />
  <rect x="0.75" y="0.75" width="1198.5" height="563.5" rx="16" fill="none" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="40" y="43" fill="#0072B2" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">03  /  TUNA-DATA FIELD GUIDE</text>
  <text x="40" y="91" fill="#19384A" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Ask for the years, species and gears you need</text>
  <text x="40" y="126" fill="#5B707C" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Selection and output schema only; no example research observations are shown.</text>
  <rect x="40" y="175" width="520" height="325" rx="12" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="64" y="214" fill="#19384A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Your R request</text>
  <line x1="64" y1="235" x2="536" y2="235" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="65" y="275" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">tuna_spatial(</text>
  <text x="65" y="303" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">  "pacific_catch_cells",</text>
  <text x="65" y="331" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">  year = 2000:2025,</text>
  <text x="65" y="359" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">  species = "YFT",</text>
  <text x="65" y="387" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">  gear = "longline",</text>
  <text x="65" y="415" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">  unit = "tonnes"</text>
  <text x="65" y="443" fill="#0072B2" font-size="20" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">)</text>
  <line x1="570" y1="335" x2="608" y2="335" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="620" y="175" width="540" height="325" rx="12" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="644" y="214" fill="#19384A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">A filtered R data frame</text>
  <line x1="644" y1="235" x2="1136" y2="235" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="272" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">year</text>
  <text x="906" y="272" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Selected years</text>
  <line x1="644" y1="282" x2="1136" y2="282" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="303" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">species_code</text>
  <text x="906" y="303" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">YFT</text>
  <line x1="644" y1="313" x2="1136" y2="313" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="334" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">gear_group</text>
  <text x="906" y="334" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Longline</text>
  <line x1="644" y1="344" x2="1136" y2="344" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="365" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">source + catch_basis</text>
  <text x="906" y="365" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Kept separate</text>
  <line x1="644" y1="375" x2="1136" y2="375" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="396" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">map_lon + map_lat</text>
  <text x="906" y="396" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Cell location</text>
  <line x1="644" y1="406" x2="1136" y2="406" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="427" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">observed_value</text>
  <text x="906" y="427" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Known subtotal</text>
  <line x1="644" y1="437" x2="1136" y2="437" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="644" y="458" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">n_missing</text>
  <text x="906" y="458" fill="#19384A" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Missing components</text>
  <text x="40" y="541" fill="#5B707C" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Year partitions are selected before conversion to an R data frame.</text>
</svg>