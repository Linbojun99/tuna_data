<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="title desc">
  <title id="title">Update sources, build results, then choose a run</title>
  <desc id="desc">Downloads and derived tables have separate version histories. Documentation schematic; no research data.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0072B2" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="565" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.3" />
  <rect x="0.75" y="0.75" width="1198.5" height="563.5" rx="16" fill="none" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="40" y="43" fill="#0072B2" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">04  /  TUNA-DATA FIELD GUIDE</text>
  <text x="40" y="91" fill="#19384A" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Update sources, build results, then choose a run</text>
  <text x="40" y="126" fill="#5B707C" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Downloads and derived tables have separate version histories.</text>
  <rect x="40" y="180" width="330" height="280" rx="12" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="64" y="219" fill="#19384A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">1  Update raw files</text>
  <line x1="64" y1="240" x2="346" y2="240" stroke="#D8E2E8" stroke-width="1.4" />
  <rect x="435" y="180" width="330" height="280" rx="12" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="459" y="219" fill="#19384A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">2  Build results</text>
  <line x1="459" y1="240" x2="741" y2="240" stroke="#D8E2E8" stroke-width="1.4" />
  <rect x="830" y="180" width="330" height="280" rx="12" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1.3" />
  <text x="854" y="219" fill="#19384A" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">3  Read a run</text>
  <line x1="854" y1="240" x2="1136" y2="240" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="64" y="278" fill="#0072B2" font-size="19" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">tuna-data update</text>
  <text x="64" y="314" fill="#0072B2" font-size="19" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">tuna-data gfw-sync</text>
  <rect x="64" y="350" width="125" height="36" rx="7" fill="#F2F6F9" stroke="none" stroke-width="1.3" />
  <text x="126.5" y="374" fill="#19384A" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="middle">Snapshot A</text>
  <rect x="201" y="350" width="145" height="36" rx="7" fill="#EEF8F5" stroke="none" stroke-width="1.3" />
  <text x="273.5" y="374" fill="#007F78" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="middle">Snapshot B</text>
  <text x="64" y="421" fill="#5B707C" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Keep earlier source versions</text>
  <text x="459" y="278" fill="#0072B2" font-size="19" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">tuna_build()</text>
  <text x="459" y="314" fill="#0072B2" font-size="19" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">tuna_spatial_build()</text>
  <rect x="459" y="350" width="125" height="36" rx="7" fill="#F2F6F9" stroke="none" stroke-width="1.3" />
  <text x="521.5" y="374" fill="#19384A" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="middle">Previous run</text>
  <rect x="596" y="350" width="150" height="36" rx="7" fill="#EEF8F5" stroke="none" stroke-width="1.3" />
  <text x="671.0" y="374" fill="#007F78" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="middle">New run</text>
  <text x="459" y="421" fill="#5B707C" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Write tables and a version lock</text>
  <text x="854" y="279" fill="#007F78" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Latest successful run</text>
  <text x="854" y="309" fill="#5B707C" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="normal" text-anchor="start">Default when run is omitted</text>
  <line x1="854" y1="333" x2="1136" y2="333" stroke="#D8E2E8" stroke-width="1.4" />
  <text x="854" y="367" fill="#19384A" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Fixed run for an analysis</text>
  <text x="854" y="405" fill="#0072B2" font-size="17" font-family="Menlo, Consolas, monospace" font-weight="normal" text-anchor="start">run = "/.../Spatial_..."</text>
  <line x1="380" y1="316" x2="424" y2="316" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="775" y1="316" x2="819" y2="316" stroke="#0072B2" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="489" width="1120" height="49" rx="8" fill="#F2F6F9" stroke="none" stroke-width="1.3" />
  <text x="64" y="520" fill="#19384A" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="start">Updating raw files does not automatically rebuild processed tables.</text>
</svg>