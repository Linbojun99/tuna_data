[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuna-data"
version = "0.2.0"
description = "Private research data library for tuna RFMOs and Global Fishing Watch"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "pandas>=2.1,<3", "filelock>=3.13,<4"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlrd>=2"]
parquet = ["pyarrow>=15"]
assessment = ["pypdf>=5,<7"]
test = ["pytest>=8"]

[project.scripts]
tuna-data = "tuna_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
